<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GRULOG.COM.BR | Domínio à venda</title>
  <meta name="description" content="O domínio GRULOG.COM.BR está disponível para venda. Entre em contato para fazer uma proposta.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #101820;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: rgba(255, 184, 0, 0.08);
      top: -300px;
      right: -180px;
    }

    body::after {
      content: "";
      position: absolute;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      background: rgba(255, 184, 0, 0.05);
      bottom: -180px;
      left: -100px;
    }

    .container {
      width: 90%;
      max-width: 900px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .icon {
      font-size: 31px;
      margin-bottom: 18px;
    }

    .tag {
      display: inline-block;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 50px;
      padding: 9px 18px;
      margin-bottom: 35px;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffb800;
    }

    h1 {
      font-size: clamp(44px, 9vw, 92px);
      letter-spacing: -3px;
      margin-bottom: 18px;
    }

    .log {
      color: #ffb800;
    }

    h2 {
      font-size: clamp(22px, 4vw, 36px);
      font-weight: 400;
      margin-bottom: 25px;
    }

    p {
      max-width: 650px;
      margin: 0 auto 38px;
      color: #b8c0c8;
      font-size: 17px;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      padding: 17px 32px;
      background: #ffb800;
      color: #101820;
      text-decoration: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      transition: .25s;
    }

    .button:hover {
      transform: translateY(-3px);
      background: #ffc83d;
    }

    .footer {
      margin-top: 55px;
      color: #687580;
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="icon">↗</div>

    <div class="tag">Domínio disponível</div>

    <h1>GRU<span class="log">LOG</span></h1>

    <h2>Este domínio está à venda.</h2>

    <p>
      Um nome curto e estratégico para logística, transportes,
      entregas, armazenagem e soluções conectadas a Guarulhos,
      um dos principais polos logísticos do Brasil.
    </p>

    <a class="button"
       href="mailto:vanda@vanda.com.br?subject=Interesse%20no%20dom%C3%ADnio%20GRULOG.COM.BR">
      TENHO INTERESSE NESTE DOMÍNIO
    </a>

    <div class="footer">
      GRULOG.COM.BR
    </div>

  </main>

</body>
</html>
